name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 让 git-revision-date 能读到完整历史

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Part 2 content
        run: python scripts/check_part2_content.py --root docs/02-deep-learning --require-complete

      - name: Deploy
        run: mkdocs gh-deploy --force
